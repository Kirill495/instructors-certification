services:

  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      INSTR_DB_NAME: ${INSTR_DB_NAME}
      INSTR_APP_USER: ${INSTR_APP_USER}
      INSTR_APP_PASSWORD: ${INSTR_APP_PASSWORD}

      PUB_DB_NAME: ${PUB_DB_NAME}
      PUB_APP_USER: ${PUB_APP_USER}
      PUB_APP_PASSWORD: ${PUB_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: instructors-app/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./config/secrets.yaml:/app/config/secrets.yaml
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/instructors?currentschema=instructors_grades

  publication:
    build:
      context: .
      dockerfile: publication-service/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${PUB_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PUB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${PUB_APP_PASSWORD}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

volumes:
  postgres_data: