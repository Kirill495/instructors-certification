services:

  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      INSTR_DB_NAME: ${INSTR_DB_NAME}
      INSTR_APP_USER: ${INSTR_APP_USER}
      INSTR_APP_PASSWORD: ${INSTR_APP_PASSWORD}

      PUB_DB_NAME: ${PUB_DB_NAME}
      PUB_APP_USER: ${PUB_APP_USER}
      PUB_APP_PASSWORD: ${PUB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: instructors-app/Dockerfile
    volumes:
      - type: bind
        source: ./config/secrets.yaml
        target: /app/config/secrets.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${INSTR_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${INSTR_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${INSTR_APP_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7001/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
      start_interval: 2s

  publication:
    build:
      context: .
      dockerfile: publication-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${PUB_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PUB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${PUB_APP_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7001/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
      start_interval: 2s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - app
      - publication
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./prometheus/rules/alerts.yml
        target: /etc/prometheus/rules/alerts.yml
        read_only: true
        bind:
          create_host_path: false
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
volumes:
  postgres_data:
  kafka_data:
  prometheus_data: