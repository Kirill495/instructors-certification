services:

  db:
    ports:
      - "5432:5432"

  app:
    ports:
      - "8081:8080"
      - "5004:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  publication:
    ports:
      - "8082:8080"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  kafka:
    ports:
      - "29092:29092"
