services:

  db:
    ports:
      - "5432:5432"

  app:
    ports:
      - "8081:8080"
      - "5004:5005"
      - "7001:7001"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/app/devdata
    volumes:
      - ./instructors-app/src/test/resources/db/migration:/app/devdata:ro

  publication:
    ports:
      - "8082:8080"
      - "5005:5005"
      - "7002:7001"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  kafka:
    ports:
      - "29092:29092"

  prometheus:
    ports:
      - "7070:9090"
