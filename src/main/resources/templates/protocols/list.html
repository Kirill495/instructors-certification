<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Протоколы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .table-card {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        /* Custom tooltip width */
        .tooltip-inner {
            max-width: 400px;
            text-align: left;
        }
        /* Freeze table header */
        .table-card thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #212529; /* table-dark color */
        }
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .clickable-row:hover {
            background-color: #e9ecef !important;
        }
    </style>
</head>
<body>
<div class="container mt-3">
    <h3 class="mb-1">Протоколы кадровой комиссии</h3>

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Toolbar -->
    <div class="mb-2">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <a href="/protocols/new" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Добавить
                </a>
                <a href="/" class="btn btn-secondary">
                    <i class="bi bi-house"></i> Главная
                </a>
            </div>
            <div class="col">
                <div class="position-relative">
                    <input type="text"
                           class="form-control"
                           id="searchString"
                           th:value="${param.search}"
                           placeholder="Введите минимум 3 символа для поиска...">
                    <button type="button"
                            class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-secondary"
                            id="clearSearch"
                            style="display: none; padding: 0.375rem 0.75rem; text-decoration: none;"
                            title="Очистить поиск">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>
            </div>
            <div class="col-auto">
                <div class="dropdown">
                    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-file-earmark-excel"></i> Excel
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#exportModal">
                                <i class="bi bi-calendar-range me-2"></i>За период...
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item" id="exportAllBtn">
                                <i class="bi bi-download me-2"></i>Все данные
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Protocols Table -->
    <div class="card table-card">
        <div class="card-body">
            <div th:if="${protocols.isEmpty()}" class="alert alert-info">
                <i class="bi bi-info-circle"></i> Нет протоколов
            </div>

            <table th:unless="${protocols.isEmpty()}" class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th style="width: 10%; cursor: pointer;"
                        th:onclick="'sortTable(\'number\')'">
                        Номер
                        <i th:if="${sortField == 'number' && sortOrder == 'asc'}" class="bi bi-sort-numeric-down ms-1"></i>
                        <i th:if="${sortField == 'number' && sortOrder == 'desc'}" class="bi bi-sort-numeric-up ms-1"></i>
                    </th>
                    <th style="width: 10%; cursor: pointer;"
                        th:onclick="'sortTable(\'date\')'">
                        Дата
                        <i th:if="${sortField == 'date' && sortOrder == 'asc'}" class="bi bi-sort-down ms-1"></i>
                        <i th:if="${sortField == 'date' && sortOrder == 'desc'}" class="bi bi-sort-up ms-1"></i>
                    </th>
                    <th style="width: 10%">№ приказа</th>
                    <th style="width: 6%">Статус</th>
                    <th style="width: 64%">Туристы</th>
                </tr>
                </thead>
                <tbody th:fragment="tableRows">
                <tr th:each="protocol : ${protocols}"
                    th:id="'protocol-' + ${protocol.id}"
                    class="clickable-row"
                    th:onclick="'window.location.href=\'/protocols/' + ${protocol.getId()} + '\''">
                    <td th:text="${protocol.number ?: '-'}">123</td>
                    <td th:text="${#temporals.format(protocol.date, 'dd.MM.yyyy')}">01.01.2024</td>
                    <td th:text="${protocol.order ?: '-'}">123</td>
                    <td th:text="${protocol.status != null ? #messages.msg('enum.ProtocolStatus.' + protocol.status.name()) : '-'}">Статус</td>
                    <td>
                        <span th:each="tourist, iterStat : ${protocol.getTourists()}">
                            <a th:if="${iterStat.index < 2}"
                               th:href="@{/tourists/{id}(id=${tourist.id})}"
                               th:text="${tourist.getFullName()}"
                               class="badge bg-secondary me-1 tourist-name">tourist_name</a>
                        </span>
                        <span th:if="${protocol.getTourists().size() > 2}"
                              class="badge bg-info me-1"
                              style="cursor: help;"
                              data-bs-toggle="tooltip"
                              data-bs-placement="top"
                              data-bs-html="true"
                              th:attr="data-bs-title=${protocol.getTooltipHtml()}"
                              th:text="${protocol.getTourists().size() - 2} + ' more'">3 more</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Infinite scroll sentinel -->
    <div id="scroll-sentinel" class="mt-2" style="height: 1px;"></div>

    <!-- Loading indicator -->
    <div id="loading-indicator" class="text-center text-muted py-2" style="display: none;">
        <div class="spinner-border spinner-border-sm me-1" role="status"></div>
        Загрузка...
    </div>

    <!-- End of list indicator -->
    <div id="end-of-list" class="text-center text-muted small py-2" style="display: none;">
        Все записи загружены (всего: <span id="total-elements" th:text="${totalElements}">0</span>)
    </div>

    <!-- Hidden metadata for JS -->
    <div id="pagination-meta"
         th:attr="data-current-page=${currentPage},
                  data-total-pages=${totalPages},
                  data-page-size=${pageSize},
                  data-sort-field=${sortField},
                  data-sort-order=${sortOrder},
                  data-search=${searchQuery}"
         style="display: none;">
    </div>
</div>

<!-- Export Period Modal -->
<div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Период выгрузки</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="dateFrom" class="form-label">С</label>
                    <div class="input-group">
                        <input type="date" class="form-control" id="dateFrom">
                        <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('dateFrom').value = ''">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-1">
                    <label for="dateTill" class="form-label">По</label>
                    <div class="input-group">
                        <input type="date" class="form-control" id="dateTill">
                        <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('dateTill').value = ''">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-success" id="exportConfirmBtn">
                    <i class="bi bi-file-earmark-excel"></i> Сформировать
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/protocols-list.js}"></script>
</body>
</html>
