<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменить пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4 offset-md-4">
            <h2 class="mb-4">Изменить пароль</h2>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/profile/password}" method="post">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Новый пароль <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="newPassword"
                                   name="newPassword" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Повторите пароль <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   name="confirmPassword" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
