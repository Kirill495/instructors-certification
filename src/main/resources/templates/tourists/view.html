<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр туриста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .collapse-toggle {
            cursor: pointer;
            transition: all 0.3s;
        }
        .collapse-toggle:hover {
            background-color: #f8f9fa;
        }
        .collapse-toggle i {
            transition: transform 0.3s;
        }
        .collapse-toggle[aria-expanded="true"] i {
            transform: rotate(180deg);
        }
        hr {
            margin-top: 0.3rem;
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>
<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Deletion not allowed:</strong>
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div class="container mt-2" th:fragment="touristCard" th:attr="data-tourist-id=${tourist.id}">
    <div class="d-flex justify-content-between align-items-baseline mb-2">
        <h3 class="mb-0">
            <span th:text="${tourist.getFullName()}">Просмотр туриста</span>
            <i th:if="${tourist.gender?.name() == 'MALE'}"   class="bi bi-gender-male  text-primary" data-bs-toggle="tooltip" th:title="#{enum.Gender.__${tourist.getGender().name()}__}"></i>
            <i th:if="${tourist.gender?.name() == 'FEMALE'}" class="bi bi-gender-female text-danger"  data-bs-toggle="tooltip" th:title="#{enum.Gender.__${tourist.getGender().name()}__}"></i>
        </h3>
        <span th:if="${tourist.certificationId != null}"
              class="badge bg-warning text-dark fs-6"
              th:text="${tourist.certificationId}"
              data-bs-toggle="tooltip"
              th:title="'Удостоверение №' + ${tourist.certificationId}">№ 12345</span>
    </div>

    <div class="card">
        <div class="card-body p-1">
            <div class="mb-2 ps-2">
                <i class="bi bi-calendar me-1"></i>
                <strong>Дата рождения: </strong>
                <span th:text="${#temporals.format(tourist.dateOfBirth, 'dd.MM.yyyy')}">01.01.1990</span>
            </div>
            <hr>
            <!-- Collapsible Contact Info -->
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center collapse-toggle p-2 rounded"
                         data-bs-toggle="collapse"
                         data-bs-target="#contactInfo"
                         aria-expanded="false"
                         aria-controls="contactInfo">
                        <strong>
                            <i class="bi bi-telephone-fill text-primary me-2"></i>
                            Контактная информация
                        </strong>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- Collapsed Content -->
<!--            <div class="collapse" id="contactInfo">-->
            <div id="contactInfo">
                <div class="card card-body bg-light">

                    <div th:if="${tourist.getContactInfo == null or tourist.getContactInfo.isEmpty()}"
                         class="text-muted">
                        <i class="bi bi-info-circle"></i> Контактная информация не указана
                    </div>

                    <div th:each="contact, iter : ${tourist.getContactInfo}"
                         th:class="${iter.last ? 'mb-0' : 'mb-2'}">

                        <th:block th:if="${contact.type.name() == 'PHONE_NUMBER'}">
                            <i class="bi bi-telephone me-1"></i>
                            <a th:href="'tel:' + ${contact.value}"
                               th:text="${contact.value}"
                               class="text-decoration-none"></a>
                        </th:block>

                        <th:block th:if="${contact.type.name() == 'EMAIL'}">
                            <i class="bi bi-envelope me-1"></i>
                            <a th:href="'mailto:' + ${contact.value}"
                               th:text="${contact.value}"
                               class="text-decoration-none"></a>
                        </th:block>

                        <th:block th:if="${contact.type.name() == 'TELEGRAM'}">
                            <i class="bi bi-telegram me-1"></i>
                            <span th:if="${contact.details != null and contact.details.nickName != null}"
                                  th:text="' (' + ${contact.details.nickName} + ')'"
                                  class="text-muted"></span>
                        </th:block>

                    </div>
                </div>
            </div>
            <hr>
            <!-- Collapsible Grade Assignments -->
            <div class="row mb-2">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center collapse-toggle p-2 rounded"
                         data-bs-toggle="collapse"
                         data-bs-target="#gradeAssignments"
                         aria-expanded="false"
                         aria-controls="gradeAssignments">

                        <strong>
                            <i class="bi bi-award-fill text-primary me-2"></i>
                            <span th:if="${tourist.assignments == null or tourist.assignments.isEmpty()}">
                                Информация о званиях отсутствует
                            </span>
                            <span th:unless="${tourist.assignments == null or tourist.getAssignments().isEmpty()}"
                                  th:text="${tourist.assignments.getLast().grade.title} + ${tourist.assignments.getLast().valid() ? ' истекает ': ' истек '} + ${#temporals.format(tourist.getAssignments.getLast().validThrough(), 'dd.MM.yyyy')}">
                            </span>

                        </strong>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="collapse" id="gradeAssignments">
                <div class="card card-body bg-light p-0">
                    <div th:if="${tourist.assignments != null and !tourist.assignments.isEmpty()}">
                        <div class="table-responsive">
                        <table class="table table-sm table-hover mb-0 small">
                            <thead class="table-light">
                            <tr>
                                <th>Вид туризма</th>
                                <th>Звание</th>
                                <th>Дата присвоения</th>
                                <th>Действителен до</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${tourist.assignments}"
                                th:with="expired=${a.validThrough != null and a.validThrough.isBefore(#temporals.createNow().toLocalDate())}"
                                th:class="${expired} ? 'table-danger' : 'table-success'">
                                <td th:text="${a.kindOfTourism?.title ?: '-'}">Пешеходный</td>
                                <td th:text="${a.grade?.title ?: '-'}">III</td>
                                <td th:text="${#temporals.format(a.date, 'dd.MM.yyyy')}">01.01.2024</td>
                                <td th:text="${a.validThrough != null ? #temporals.format(a.validThrough, 'dd.MM.yyyy') : '-'}">01.01.2024</td>
                            </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                    <div th:if="${tourist.assignments == null or tourist.assignments.isEmpty()}"
                         class="text-muted p-3">
                        <i class="bi bi-info-circle"></i> Звания не присваивались
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <a th:href="@{/tourists/{id}/edit(id=${tourist.id})}" class="btn btn-warning">
                <i class="bi bi-pencil"></i> Изменить
            </a>
            <a href="/tourists" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> К списку
            </a>

            <!-- Delete button -->
            <button type="button"
                    class="btn btn-danger float-end"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteModal">
                <i class="bi bi-trash"></i> Удалить
            </button>
        </div>
    </div>
</div>

<!-- Include reusable delete modal with tourist-specific text -->
<div th:replace="~{fragments/delete-modal :: deleteModal(
    itemName=${tourist.getFullName()},
    itemType='туриста',
    deleteUrl=@{/tourists/{id}/delete(id=${tourist.id})},
    warningText='Если этот турист участвует в протоколах, удаление может вызвать ошибку.'
)}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
</script>

</body>
</html>
