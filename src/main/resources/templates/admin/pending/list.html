<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки на регистрацию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        tbody tr { cursor: pointer; }
        tbody tr:hover { background-color: rgba(0,0,0,.04); }

        @media (max-width: 767px) {
            table, tbody { display: block; }
            thead { display: none; }
            tbody tr {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                padding: 8px 12px;
                border-bottom: 1px solid #dee2e6;
            }
            tbody td { display: block; padding: 1px 4px; border: none !important; }
            tbody td:nth-child(1) { order: 1; }
            tbody td:nth-child(2) { order: 2; flex: 1; font-weight: 600; }
            tbody td:nth-child(5) { order: 3; font-size: 0.8rem; color: #6c757d; margin-left: auto; }
            tbody td:nth-child(3) { order: 4; width: 50%; font-size: 0.8rem; color: #6c757d; }
            tbody td:nth-child(4) { order: 5; width: 50%; font-size: 0.8rem; color: #6c757d; }
        }

        #linkModal .modal-dialog {
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            margin: 0;
        }
        #linkModal.show .modal-dialog {
            transform: translateY(0);
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        .panel-block {
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .panel-block.disabled {
            opacity: 0.45;
            pointer-events: none;
        }

        .search-wrapper { position: relative; }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            z-index: 200;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 0.375rem 0.375rem;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            background: #fff;
        }
        .search-results:empty { display: none; }
        .search-results .list-group-item { border-left: none; border-right: none; border-radius: 0; }
        .search-results .list-group-item:last-child { border-bottom: none; border-radius: 0 0 0.375rem 0.375rem; }

        #linkedTouristRow { display: flex; align-items: center; gap: 0.5rem; }
        #linkedTouristRow.hidden { display: none; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Заявки на регистрацию</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="mb-3">
        <a href="/" class="btn btn-secondary">Главная</a>
    </div>

    <div th:if="${pending.isEmpty()}" class="alert alert-info">Новых заявок нет</div>

    <div th:unless="${pending.isEmpty()}" class="card">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th style="width:1%"></th>
                    <th>ФИО</th>
                    <th>Вид туризма</th>
                    <th>Звание</th>
                    <th>Дата заявки</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pending}"
                    th:data-id="${p.id}"
                    th:data-name="${p.fullName}"
                    th:data-kind="${p.kindOfTourism.title}"
                    th:data-grade="${p.grade.title}"
                    th:data-linked="${p.tourist != null}"
                    th:data-tourist-name="${p.tourist != null ? p.tourist.lastName + ' ' + p.tourist.firstName : ''}"
                    th:data-dob="${p.dateOfBirth != null ? #temporals.format(p.dateOfBirth, 'dd.MM.yyyy') : '—'}"
                    th:data-phone="${p.phoneNumber != null ? p.phoneNumber : '—'}"
                    th:data-email="${p.email != null ? p.email : '—'}"
                    onclick="openPanel(this)">
                    <td class="text-center">
                        <span th:if="${p.tourist != null}" title="Турист привязан" style="font-size:1.1rem">🔗</span>
                        <span th:if="${p.tourist == null}" title="Новый турист" style="font-size:1.1rem">🆕</span>
                    </td>
                    <td th:text="${p.fullName}"></td>
                    <td th:text="${p.kindOfTourism.title}"></td>
                    <td th:text="${p.grade.title}"></td>
                    <td th:text="${#temporals.format(p.createdAt, 'dd.MM.yyyy')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Fullscreen slide-up panel -->
<div class="modal fade" id="linkModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h5 class="modal-title mb-0" id="modalName"></h5>
                    <small class="text-muted" id="modalMeta"></small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" style="max-width: 640px; width: 100%">

                <!-- Pending details -->
                <div class="panel-block mb-3">
                    <div class="row g-2 small">
                        <div class="col-4"><span class="text-muted">Дата рождения:</span><br><strong id="detailDob"></strong></div>
                        <div class="col-4"><span class="text-muted">Телефон:</span><br><strong id="detailPhone"></strong></div>
                        <div class="col-4"><span class="text-muted">Email:</span><br><strong id="detailEmail"></strong></div>
                    </div>
                    <div id="linkedTouristRow" class="hidden mt-2 pt-2 border-top">
                        <span class="text-muted small">Турист:</span>
                        <span class="badge bg-primary fs-6">🔗 <span id="linkedTouristName"></span></span>
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                onclick="unlinkTourist()">Открепить</button>
                    </div>
                </div>

                <!-- Section 1: Tourist (hidden when tourist already linked) -->
                <div id="touristSection">
                    <div class="section-label">Поиск туриста</div>
                    <div class="panel-block" id="touristPanel">
                        <div id="searchInputWrapper" class="search-wrapper mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" id="modalSearch" class="form-control"
                                       placeholder="Фамилия или номер удостоверения...">
                            </div>
                            <div id="searchResults" class="search-results list-group"></div>
                        </div>

                        <div id="selectedTouristBadge" style="display:none" class="mb-3 d-flex align-items-center gap-2">
                            <span class="badge bg-success fs-6" id="selectedTouristName"></span>
                            <button type="button" class="btn btn-sm btn-primary"
                                    onclick="linkTourist()">Прикрепить</button>
                            <button type="button" class="btn btn-sm btn-link text-danger p-0"
                                    onclick="clearTourist()">Изменить</button>
                        </div>

                        <div id="createNewPanel" class="mt-2">
                            <div id="createNewBadge" style="display:none" class="mb-2">
                                <span class="badge bg-secondary fs-6">Будет создан новый профиль</span>
                                <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2"
                                        onclick="clearCreateNew()">Изменить</button>
                            </div>
                            <button id="createNewBtn" type="button" class="btn btn-outline-secondary btn-sm"
                                    onclick="enableCreateNew()">Создать нового туриста</button>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Protocol -->
                <div class="section-label">Протокол <span class="text-muted fw-normal">(необязательно)</span></div>
                <div class="panel-block disabled" id="protocolPanel">
                    <div id="protocolDisabledMsg" class="text-muted small">Сначала выберите или создайте туриста</div>
                    <div id="protocolSearchPanel" style="display:none">
                        <div class="search-wrapper mb-2">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" id="protocolSearch" class="form-control"
                                       placeholder="Номер протокола...">
                            </div>
                            <div id="protocolResults" class="search-results list-group"></div>
                        </div>
                        <div id="selectedProtocolBadge" style="display:none">
                            <span class="badge bg-info text-dark fs-6" id="selectedProtocolLabel"></span>
                            <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2"
                                    onclick="clearProtocol()">Убрать</button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="modal-footer">
                <form id="approveForm" method="post" onsubmit="prepareApprove()">
                    <input type="hidden" id="hiddenProtocolId" name="protocolId" disabled>
                    <button type="submit" class="btn btn-success">Одобрить</button>
                </form>
                <form id="rejectForm" method="post" onsubmit="return confirm('Отклонить заявку?')">
                    <button type="submit" class="btn btn-danger">Отклонить</button>
                </form>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let pendingId = null;
    let selectedTouristId = null;
    let selectedProtocolId = null;
    let touristResolved = false;

    function openPanel(row) {
        pendingId        = row.dataset.id;
        const linked     = row.dataset.linked === 'true';

        document.getElementById('modalName').textContent = row.dataset.name;
        document.getElementById('modalMeta').textContent = row.dataset.kind + ' · ' + row.dataset.grade;
        document.getElementById('detailDob').textContent   = row.dataset.dob;
        document.getElementById('detailPhone').textContent = row.dataset.phone;
        document.getElementById('detailEmail').textContent = row.dataset.email;
        document.getElementById('approveForm').action  = '/pending/' + pendingId + '/approve';
        document.getElementById('rejectForm').action   = '/pending/' + pendingId + '/reject';

        // Reset state
        selectedTouristId  = null;
        selectedProtocolId = null;
        touristResolved    = false;
        resetProtocolPanel();

        if (linked) {
            document.getElementById('touristSection').classList.add('d-none');
            document.getElementById('linkedTouristRow').classList.remove('hidden');
            document.getElementById('linkedTouristName').textContent = row.dataset.touristName;
            enableProtocolPanel();
        } else {
            document.getElementById('touristSection').classList.remove('d-none');
            document.getElementById('linkedTouristRow').classList.add('hidden');
            resetTouristSearch(row.dataset.name);
            disableProtocolPanel();
        }

        bootstrap.Modal.getOrCreateInstance(document.getElementById('linkModal')).show();
    }

    // ── Tourist section ──────────────────────────────────────────────────────

    function resetTouristSearch(name) {
        document.getElementById('modalSearch').value = name;
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('selectedTouristBadge').style.display = 'none';
        document.getElementById('createNewBadge').style.display = 'none';
        document.getElementById('createNewBtn').style.display = '';
        document.getElementById('searchInputWrapper').style.display = '';
        doTouristSearch(name, true);
    }

    document.getElementById('modalSearch').addEventListener('input', function () {
        doTouristSearch(this.value.trim(), false);
    });

    function doTouristSearch(query, autoSelect) {
        if (query.length < 2) { document.getElementById('searchResults').innerHTML = ''; return; }
        fetch('/api/tourists/search?query=' + encodeURIComponent(query))
            .then(r => r.json())
            .then(list => {
                if (autoSelect && list.length === 1) {
                    const t = list[0];
                    selectTourist(t.id, `${t.lastName} ${t.firstName} ${t.middleName ?? ''}`.trim());
                    return;
                }
                const c = document.getElementById('searchResults');
                if (list.length === 0) {
                    c.innerHTML = '<div class="list-group-item text-muted">Турист по ФИО не найден</div>';
                    return;
                }
                c.innerHTML = list.map(t =>
                    `<button type="button" class="list-group-item list-group-item-action"
                             onclick="selectTourist(${t.id}, '${esc(t.lastName)} ${esc(t.firstName)} ${esc(t.middleName ?? '')}')">
                        ${t.lastName} ${t.firstName} ${t.middleName ?? ''}
                        <span class="text-muted small ms-1">${t.certificationId ?? ''}</span>
                    </button>`
                ).join('');
            });
    }

    function selectTourist(id, name) {
        selectedTouristId = id;
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('searchInputWrapper').style.display = 'none';
        document.getElementById('createNewBtn').style.display = 'none';
        document.getElementById('selectedTouristName').textContent = '✓ ' + name;
        document.getElementById('selectedTouristBadge').style.display = '';
        enableProtocolPanel();
    }

    function clearTourist() {
        selectedTouristId = null;
        document.getElementById('searchInputWrapper').style.display = '';
        document.getElementById('selectedTouristBadge').style.display = 'none';
        document.getElementById('createNewBtn').style.display = '';
        disableProtocolPanel();
    }

    function enableCreateNew() {
        selectedTouristId = null;
        document.getElementById('searchInputWrapper').style.display = 'none';
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('createNewBtn').style.display = 'none';
        document.getElementById('createNewBadge').style.display = '';
        enableProtocolPanel();
    }

    function clearCreateNew() {
        document.getElementById('searchInputWrapper').style.display = '';
        document.getElementById('createNewBadge').style.display = 'none';
        document.getElementById('createNewBtn').style.display = '';
        disableProtocolPanel();
    }

    // ── Protocol section ─────────────────────────────────────────────────────

    function enableProtocolPanel() {
        touristResolved = true;
        document.getElementById('protocolPanel').classList.remove('disabled');
        document.getElementById('protocolDisabledMsg').style.display = 'none';
        document.getElementById('protocolSearchPanel').style.display = '';
    }

    function disableProtocolPanel() {
        touristResolved = false;
        resetProtocolPanel();
        document.getElementById('protocolPanel').classList.add('disabled');
        document.getElementById('protocolDisabledMsg').style.display = '';
        document.getElementById('protocolSearchPanel').style.display = 'none';
    }

    function resetProtocolPanel() {
        selectedProtocolId = null;
        document.getElementById('protocolSearch').value = '';
        document.getElementById('protocolResults').innerHTML = '';
        document.getElementById('selectedProtocolBadge').style.display = 'none';
    }

    document.getElementById('protocolSearch').addEventListener('input', function () {
        doProtocolSearch(this.value.trim());
    });

    function doProtocolSearch(query) {
        if (query.length < 1) { document.getElementById('protocolResults').innerHTML = ''; return; }
        fetch('/api/protocols/search?query=' + encodeURIComponent(query))
            .then(r => r.json())
            .then(list => {
                const c = document.getElementById('protocolResults');
                if (list.length === 0) {
                    c.innerHTML = '<div class="list-group-item text-muted">Протокол не найден</div>';
                    return;
                }
                c.innerHTML = list.map(p =>
                    `<button type="button" class="list-group-item list-group-item-action"
                             onclick="selectProtocol(${p.id}, '${esc(p.number)}', '${p.date}')">
                        ${p.number}
                        <span class="text-muted small ms-1">${p.date}</span>
                    </button>`
                ).join('');
            });
    }

    function selectProtocol(id, number, date) {
        selectedProtocolId = id;
        document.getElementById('protocolResults').innerHTML = '';
        document.getElementById('protocolSearch').value = '';
        document.getElementById('selectedProtocolLabel').textContent = '📋 ' + number + '  ' + date;
        document.getElementById('selectedProtocolBadge').style.display = '';
    }

    function clearProtocol() {
        selectedProtocolId = null;
        document.getElementById('selectedProtocolBadge').style.display = 'none';
    }

    // ── Submit ───────────────────────────────────────────────────────────────

    function prepareApprove() {
        const pInput = document.getElementById('hiddenProtocolId');
        if (selectedProtocolId) { pInput.value = selectedProtocolId; pInput.disabled = false; }
    }

    function linkTourist() {
        fetch('/api/pending/' + pendingId + '/link?tourist_id=' + selectedTouristId, { method: 'POST' })
            .then(r => {
                if (r.ok) {
                    const name = document.getElementById('selectedTouristName').textContent.replace(/^✓\s*/, '');
                    document.getElementById('touristSection').classList.add('d-none');
                    document.getElementById('linkedTouristName').textContent = name;
                    document.getElementById('linkedTouristRow').classList.remove('hidden');
                } else {
                    alert('Ошибка при прикреплении');
                }
            });
    }

    function unlinkTourist() {
        if (!confirm('Открепить туриста от заявки?')) return;
        fetch('/api/pending/' + pendingId + '/unlink', { method: 'POST' })
            .then(r => { if (r.ok) location.reload(); else alert('Ошибка при откреплении'); });
    }

    function esc(s) { return (s ?? '').replace(/'/g, "\\'"); }
</script>
</body>
</html>
