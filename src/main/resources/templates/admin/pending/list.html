<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки на регистрацию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Заявки на регистрацию</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="mb-3">
        <a href="/" class="btn btn-secondary">Главная</a>
    </div>

    <div th:if="${pending.isEmpty()}" class="alert alert-info">Новых заявок нет</div>

    <div th:unless="${pending.isEmpty()}" class="card">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ФИО</th>
                    <th>Дата рождения</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Telegram</th>
                    <th>Дата заявки</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pending}">
                    <td th:text="${p.fullName}"></td>
                    <td th:text="${p.dateOfBirth != null ? #temporals.format(p.dateOfBirth, 'dd.MM.yyyy') : '—'}"></td>
                    <td th:text="${p.phoneNumber != null ? p.phoneNumber : '—'}"></td>
                    <td th:text="${p.email != null ? p.email : '—'}"></td>
                    <td th:text="${p.tgUsername != null ? '@' + p.tgUsername : '—'}"></td>
                    <td th:text="${#temporals.format(p.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="text-end">
                        <form th:action="@{/admin/pending/{id}/approve(id=${p.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Одобрить</button>
                        </form>
                        <form th:action="@{/admin/pending/{id}/reject(id=${p.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Отклонить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
