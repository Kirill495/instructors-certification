<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Регистрация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            padding: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }

        input::placeholder {
            color: var(--tg-theme-hint-color, #999999);
        }

        .gender-row {
            display: flex;
            gap: 8px;
        }

        .gender-btn {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #f1f1f1);
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .gender-btn.selected {
            border-color: var(--tg-theme-button-color, #2481cc);
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .required {
            color: var(--tg-theme-destructive-text-color, #cc2929);
            margin-left: 2px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #999999);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 10px;
        }
    </style>
</head>
<body>

<div class="section-title">Личные данные</div>

<div class="form-group">
    <label>Фамилия <span class="required">*</span></label>
    <input type="text" id="lastName" placeholder="Иванов" autocomplete="family-name">
</div>

<div class="form-group">
    <label>Имя <span class="required">*</span></label>
    <input type="text" id="firstName" placeholder="Иван" autocomplete="given-name">
</div>

<div class="form-group">
    <label>Отчество</label>
    <input type="text" id="middleName" placeholder="Иванович">
</div>

<div class="form-group">
    <label>Пол <span class="required">*</span></label>
    <div class="gender-row">
        <button class="gender-btn" id="genderMale" onclick="selectGender('MALE')">Мужской ♂</button>
        <button class="gender-btn" id="genderFemale" onclick="selectGender('FEMALE')">Женский ♀</button>
    </div>
</div>

<div class="form-group">
    <label>Дата рождения <span class="required">*</span></label>
    <input type="date" id="dateOfBirth">
</div>

<div class="section-title">Контакты</div>

<div class="form-group">
    <label>Телефон <span class="required">*</span></label>
    <input type="tel" id="phone" placeholder="+7 999 123-45-67" autocomplete="tel">
</div>

<div class="form-group">
    <label>Email <span class="required">*</span></label>
    <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email">
</div>

<div class="section-title">Туризм</div>

<div class="form-group">
    <label>Вид туризма <span class="required">*</span></label>
    <select id="kindOfTourism">
        <option value="">— выберите —</option>
    </select>
</div>

<div class="form-group">
    <label>Звание <span class="required">*</span></label>
    <select id="grade">
        <option value="">— выберите —</option>
    </select>
</div>

<script th:inline="javascript">
    const kindsOfTourism = /*[[${kindsOfTourism}]]*/ [];
    const grades = /*[[${grades}]]*/ [];

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Populate selects
    kindsOfTourism.forEach(k => {
        document.getElementById('kindOfTourism').add(new Option(k.title, k.id));
    });
    grades.forEach(g => {
        document.getElementById('grade').add(new Option(g.title, g.id));
    });

    // Gender
    let selectedGender = null;
    function selectGender(g) {
        selectedGender = g;
        document.getElementById('genderMale').classList.toggle('selected', g === 'MALE');
        document.getElementById('genderFemale').classList.toggle('selected', g === 'FEMALE');
    }

    // Phone mask: auto-format as +7 XXX XXX-XX-XX
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function () {
        let digits = this.value.replace(/\D/g, '');
        if (digits.startsWith('8')) digits = '7' + digits.slice(1);
        if (digits.length > 0 && !digits.startsWith('7')) digits = '7' + digits;
        digits = digits.slice(0, 11);

        let out = '';
        if (digits.length > 0)  out = '+' + digits[0];
        if (digits.length > 1)  out += ' ' + digits.slice(1, 4);
        if (digits.length > 4)  out += ' ' + digits.slice(4, 7);
        if (digits.length > 7)  out += '-' + digits.slice(7, 9);
        if (digits.length > 9)  out += '-' + digits.slice(9, 11);
        this.value = out;
    });

    // Main button
    tg.MainButton.setText('Отправить заявку');
    tg.MainButton.show();
    tg.MainButton.onClick(function () {
        const lastName       = document.getElementById('lastName').value.trim();
        const firstName      = document.getElementById('firstName').value.trim();
        const middleName     = document.getElementById('middleName').value.trim();
        const dateOfBirth    = document.getElementById('dateOfBirth').value;
        const phone          = document.getElementById('phone').value.trim();
        const email          = document.getElementById('email').value.trim();
        const kindOfTourismId = document.getElementById('kindOfTourism').value;
        const gradeId        = document.getElementById('grade').value;

        if (!lastName || !firstName || !selectedGender || !dateOfBirth || !phone || !email || !kindOfTourismId || !gradeId) {
            tg.showAlert('Пожалуйста, заполните все обязательные поля (*).');
            return;
        }

        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            tg.showAlert('Введите корректный email адрес.');
            return;
        }

        const today = new Date();
        const dob = new Date(dateOfBirth);
        const age18 = new Date(dob.getFullYear() + 18, dob.getMonth(), dob.getDate());
        if (age18 > today) {
            tg.showAlert('Регистрация доступна только с 18 лет.');
            return;
        }

        tg.sendData(JSON.stringify({
            lastName,
            firstName,
            middleName:      middleName || null,
            gender:          selectedGender,
            dateOfBirth,
            phone:           phone || null,
            email:           email || null,
            kindOfTourismId: parseInt(kindOfTourismId),
            gradeId:         parseInt(gradeId)
        }));
    });
</script>

</body>
</html>
