global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'instructors-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:7001']

  - job_name: 'publication-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['publication:7001']